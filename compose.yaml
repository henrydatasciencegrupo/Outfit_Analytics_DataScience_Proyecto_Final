
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: outfit-analytics-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  streamlit:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: outfit-analytics-streamlit
    ports:
      - "8501:8501"
    environment:
      LOOKWISE_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped