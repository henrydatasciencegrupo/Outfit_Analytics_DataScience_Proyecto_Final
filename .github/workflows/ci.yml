name: Lookwise - Continuous Integration

on:
  push:
    branches:
      - main
      - rama-nacho

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test-api:
    name: Test FastAPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt

      - name: Verify required model and demo files
        run: |
          test -f models/ranker_clasificador.joblib
          test -f models/configuracion_modelo.json
          test -f api/datos/clientes_test.csv
          test -f api/datos/candidatas_test.parquet

      - name: Check Python syntax
        run: |
          python -m compileall -q api src

      - name: Run FastAPI tests
        working-directory: api
        run: python -m pytest test_lookwise_api.py -v

  check-streamlit:
    name: Check Streamlit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Streamlit Python syntax
        run: python -m py_compile app/app.py

      - name: Verify Streamlit demo files
        run: |
          test -f app/datos/clientes_test.csv
          test -f app/datos/configuracion_modelo.json
          test -f app/datos/prendas_min.parquet